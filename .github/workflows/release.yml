name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Determine release label on merged PR
        id: pr_label
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const headSha = process.env.GITHUB_SHA;
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: headSha
            });
            const pr = prs.find(p => p.merged_at);
            if (!pr) {
              core.info('No merged PR found for this commit.');
              return { release_label: '' };
            }
            const labels = pr.labels.map(l => l.name.toLowerCase());
            core.info(`Found PR #${pr.number} - labels: ${labels.join(', ')}`);
            const releaseLabel = labels.find(l => l.startsWith('release:')) || '';
            return { release_label: releaseLabel };

      - name: Install dependencies
        if: ${{ steps.pr_label.outputs.release_label || github.event_name == 'workflow_dispatch' }}
        run: npm ci

      - name: Run standard-version (label-driven)
        if: ${{ steps.pr_label.outputs.release_label || github.event_name == 'workflow_dispatch' }}
        run: |
          RELEASE_LABEL="${{ steps.pr_label.outputs.release_label }}"
          if [ -n "$RELEASE_LABEL" ]; then
            BASENAME=${RELEASE_LABEL#release:}
            echo "Forcing release-as=$BASENAME"
            npm run release -- --release-as $BASENAME
          else
            echo "No release label found — running standard-version normally to infer changes"
            npm run release
          fi

      - name: Commit changelog and package bumps
        run: |
          git config user.name "GitHub Action"
          git config user.email "actions@github.com"
          git add CHANGELOG.md package.json package-lock.json || true
          git commit -m "chore(release): bump version and changelog [skip ci]" || echo "no changes to commit"

      - name: Push changes and tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin HEAD:$(echo $GITHUB_REF | sed 's|refs/heads/||')
          git push --tags
