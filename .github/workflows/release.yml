name: Release

on:
  push:
    # run when branch name starts with release/
    branches:
      - 'release/**'
  workflow_dispatch: {}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run standard-version
        run: npm run release

      - name: Commit changelog and package bumps
        run: |
          git config user.name "GitHub Action"
          git config user.email "actions@github.com"
          git add CHANGELOG.md package.json package-lock.json || true
          git commit -m "chore(release): bump version and changelog [skip ci]" || echo "no changes to commit"

      - name: Push changes and tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin HEAD:$(echo $GITHUB_REF | sed 's|refs/heads/||')
          git push --tags
