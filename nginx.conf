server {
    listen 80;

    # Root for static frontend files
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for speed
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Proxy headers (needed for Cloudflare tunnel and proper IP forwarding)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_cache_bypass $http_upgrade;

    # API reverse proxy — no trailing slash so /api/ prefix is preserved
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
    }

    # Auth reverse proxy
    location /auth/ {
        proxy_pass http://127.0.0.1:3000;
    }

    # Uploaded files reverse proxy
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
    }

    # Frontend (Single Page App fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
